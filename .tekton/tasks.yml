apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove Python cache files from the source workspace.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: python:3.11-slim
      script: |
        #!/usr/bin/env bash
        set -e
        find "$(workspaces.source.path)" -type d -name __pycache__ -prune -exec rm -rf {} +
        find "$(workspaces.source.path)" -type f -name "*.pyc" -delete
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Install nose and run the project's unit tests.
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests-with-nose
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        python -m pip install --disable-pip-version-check nose
        nosetests -v
